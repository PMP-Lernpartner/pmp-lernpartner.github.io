# Baut die Android-App des PMP-Lernpartners (APK und AAB) und legt sie als Release ab.
# Läuft bei jeder Änderung an der Lern-App oder am Android-Projekt, oder von Hand ("Run workflow").
# Der Signaturschlüssel liegt nicht im Repository, sondern nur in zwei GitHub-Secrets:
#   KEYSTORE_BASE64   = Schlüsseldatei pmp-lernpartner.p12 als Base64-Text
#   KEYSTORE_PASSWORD = Passwort der Schlüsseldatei
name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Signaturschlüssel aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/pmp-lernpartner.p12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Lern-App ins Android-Projekt kopieren
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: APK und AAB bauen und signieren
        working-directory: android-app/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pmp-lernpartner.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: pmp-lernpartner
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android-app/android/app/build/outputs/apk/release/app-release.apk | grep -i "sha-256"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir aus
          cp android-app/android/app/build/outputs/apk/release/app-release.apk aus/PMP-Lernpartner.apk
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab aus/PMP-Lernpartner.aab
          gh release create "android-${{ github.run_number }}" aus/PMP-Lernpartner.apk aus/PMP-Lernpartner.aab \
            --title "Android-App 1.1.${{ github.run_number }}" \
            --notes "Zum Installieren am Handy PMP-Lernpartner.apk antippen. Die .aab-Datei ist nur für den Play Store." \
            --latest

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/pmp-lernpartner.p12"
